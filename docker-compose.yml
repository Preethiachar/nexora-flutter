name: nexora
services:
  mongodb:
    image: mongo:7
    container_name: nexora-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: nexora

  server:
    build: ./server
    container_name: nexora-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/nexora
      JWT_SECRET: change_this_in_production_please
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      - mongodb
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build: ./client
    container_name: nexora-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
