<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora Flutter Phone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #ecfdf5 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 16px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 8px 14px;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }
    .brand {
      font-weight: 800;
      font-size: 14px;
      color: #059669;
      margin-right: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }
    button, a.btn {
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    button:hover, a.btn:hover {
      border-color: #10b981;
      color: #059669;
      background: #ecfdf5;
    }
    button.active {
      background: #059669;
      color: #ffffff;
      border-color: #059669;
    }
    .phone-shell {
      background: #0f172a;
      padding: 14px;
      border-radius: 46px;
      box-shadow: 0 28px 60px rgba(15, 23, 42, 0.25), 0 0 0 2px #334155;
      position: relative;
      transition: all 0.25s ease;
    }
    .notch {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 22px;
      background: #0f172a;
      border-radius: 999px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      pointer-events: none;
    }
    .camera {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .screen-wrap {
      width: 390px;
      height: 780px;
      border-radius: 34px;
      overflow: hidden;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 36px;
      background: #ffffff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: 11px;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 1px solid #f1f5f9;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #ffffff;
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="brand"><span class="dot"></span> Nexora Live Flutter Phone</span>
    <button class="active" onclick="setSize(390, 780, this)">iPhone 15 (390×780)</button>
    <button onclick="setSize(412, 820, this)">Pixel 8 (412×820)</button>
    <button onclick="setSize(360, 720, this)">Compact (360×720)</button>
    <button onclick="reloadFrame()">↻ Reload</button>
    <a class="btn" id="fullFlutterLink" href="http://localhost:8080" target="_blank">Full Screen Flutter ↗</a>
    <a class="btn" href="http://localhost:3000" target="_blank" id="reactLink">Web App ↗</a>
  </div>

  <div class="phone-shell">
    <div class="notch"><span class="camera"></span></div>
    <div class="screen-wrap" id="screenWrap">
      <div class="status-bar">
        <span>9:41</span>
        <span>5G · 100%</span>
      </div>
      <iframe id="flutterFrame" src="about:blank" title="Nexora Flutter Mobile"></iframe>
    </div>
  </div>

  <p class="hint">Live Flutter app connected to Express + MongoDB</p>

  <script>
    const isLocalDev = window.location.hostname === 'localhost' && window.location.port === '5000';
    const flutterUrl = `${window.location.origin}/jobs`;
    document.getElementById('flutterFrame').src = flutterUrl;
    document.getElementById('fullFlutterLink').href = flutterUrl;
    if (!isLocalDev) {
      document.getElementById('reactLink').style.display = 'none';
    }
    function setSize(w, h, btn) {
      const wrap = document.getElementById('screenWrap');
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';
      document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function reloadFrame() {
      const frame = document.getElementById('flutterFrame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
